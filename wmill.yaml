# yaml-language-server: $schema=https://raw.githubusercontent.com/windmill-labs/windmill/v1.871.1/cli/wmill.schema.json
# Windmill CLI config for the SIS scheduler. Deploy: `wmill sync push`
# (see README.md). Generated by `wmill init` (CLI 1.871.1), trimmed.

includes:
  - "f/sis/**"

# Variables are set per environment with `wmill variable add`, not synced:
# the claim-service URL differs between local and server, and the API key
# is a secret that must never be in a file.
skipVariables: true
skipSecrets: true
skipResources: true
skipResourceTypes: true

# Folder `sis` is created once per workspace (UI or `wmill folder push sis`
# from a pulled copy); syncing it would overwrite its owners/permissions.
skipFolders: true

skipScripts: false
skipFlows: true
skipApps: true
skipWorkspaceDependencies: true
skipDatatableMigrations: true

# Schedules are synced: the cron lives in f/sis/*.schedule.yaml.
includeSchedules: true

nonDottedPaths: true
syncBehavior: v1
codebases: []
workspaces: {}
